# Copper Canyon: Warm canyon dusk: espresso and red-rock browns, glowing copper, and a desert-sky blue. The "earn it" dashboards.

# dark on every device: form and dropdown colors are set explicitly so light-mode phones stay readable.
Copper Canyon:
  ha-card-border-radius: "20px"
  ha-card-border-width: "1px"
  ha-dialog-border-radius: "22px"
  mdc-shape-medium: "14px"
  lovelace-background: >-
    radial-gradient(1000px 520px at 10% -10%, rgba(232, 145, 92, 0.22), transparent 62%),
    radial-gradient(900px 480px at 105% 5%, rgba(124, 196, 232, 0.14), transparent 62%),
    radial-gradient(1200px 700px at 50% 120%, rgba(181, 72, 47, 0.18), transparent 62%),
    linear-gradient(165deg, #140d0a 0%, #1f140f 50%, #0f0a08 100%)
