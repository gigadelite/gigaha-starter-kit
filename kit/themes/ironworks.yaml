  indigo-color: "#8090ee"
  purple-color: "#a98fe8"
  pink-color: "#ee9bbd"
  red-color: "#ff6b5e"
  deep-orange-color: "#ff7f45"
  orange-color: "#ff9a3d"
  amber-color: "#ffbd45"
  yellow-color: "#ffd966"
