# Ironworks: Workshop steel: graphite and gunmetal, electric teal for "all good", safety orange when something needs you.

# dark on every device: form and dropdown colors are set explicitly so light-mode phones stay readable.
Ironworks:
  ha-card-border-radius: "20px"
  ha-card-border-width: "1px"
  ha-dialog-border-radius: "22px"
  mdc-shape-medium: "14px"
  lovelace-background: >-
    radial-gradient(1000px 520px at 0% -10%, rgba(62, 211, 192, 0.13), transparent 62%),
    radial-gradient(900px 480px at 105% 5%, rgba(255, 154, 61, 0.1), transparent 62%),
    radial-gradient(1200px 700px at 50% 120%, rgba(58, 70, 86, 0.4), transparent 62%),
    linear-gradient(165deg, #0d0f12 0%, #14171c 50%, #0a0c0e 100%)
  primary-color: "#3ed3c0"
  accent-color: "#ff9a3d"
  primary-background-color: "#0d0f12"
  secondary-background-color: "#14171c"
  card-background-color: "#191d23"
  ha-card-background: "linear-gradient(160deg, rgba(25, 29, 35, 0.92), rgba(18, 21, 25, 0.94))"
  ha-card-border-color: "rgba(62, 211, 192, 0.16)"
  ha-card-box-shadow: "0 6px 22px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.04)"
  primary-text-color: "#eef1f4"
  secondary-text-color: "#aab3bd"
  disabled-text-color: "#636b74"
  text-primary-color: "#141414"
  divider-color: "rgba(238, 241, 244, 0.1)"
  state-icon-color: "#3ed3c0"
  paper-item-icon-color: "#3ed3c0"
  state-icon-active-color: "#3ed3c0"
  app-header-background-color: "#0d0f12"
  app-header-text-color: "#eef1f4"
  app-header-edit-background-color: "#20252c"
  sidebar-background-color: "#0d0f12"
  sidebar-text-color: "#aab3bd"
  sidebar-icon-color: "#aab3bd"
  sidebar-selected-text-color: "#3ed3c0"
  sidebar-selected-icon-color: "#3ed3c0"
  input-fill-color: "#232831"
  ha-color-form-background: "#232831"
  ha-color-form-background-hover: "#2c323c"
  ha-color-form-background-disabled: "#121519"
  mdc-text-field-fill-color: "#232831"
  mdc-select-fill-color: "#232831"
  mdc-select-ink-color: "#eef1f4"
  mdc-select-label-ink-color: "#aab3bd"
  mdc-select-dropdown-icon-color: "#3ed3c0"
  input-ink-color: "#eef1f4"
  input-label-ink-color: "#aab3bd"
  input-dropdown-icon-color: "#3ed3c0"
  ha-color-text-primary: "#eef1f4"
  ha-color-text-secondary: "#aab3bd"
  mdc-theme-surface: "#20252c"
  wa-color-surface-raised: "#20252c"
  wa-color-text-normal: "#eef1f4"
  ha-color-fill-neutral-quiet-resting: "#20252c"
  ha-color-fill-neutral-quiet-hover: "#2c323c"
  ha-color-fill-neutral-quiet-active: "#2c323c"
  ha-color-fill-neutral-normal-active: "#2c323c"
  ha-color-fill-neutral-normal-hover: "#2c323c"
  mdc-theme-primary: "#3ed3c0"
  switch-checked-color: "#3ed3c0"
  switch-checked-button-color: "#3ed3c0"
  switch-checked-track-color: "#3ed3c0"
  slider-color: "#3ed3c0"
  slider-bar-color: "rgba(238, 241, 244, 0.2)"
  ha-color-primary-50: "#3ed3c0"
  state-sensor-color: "#3ed3c0"
  markdown-code-background-color: "#232831"
  code-editor-background-color: "#121519"
  # Named colors (tile/gauge `color:` options) retuned to the palette
  green-color: "#5fd394"
  light-green-color: "#9be0b3"
  teal-color: "#3ed3c0"
  cyan-color: "#5fc8e8"
  blue-color: "#5f9df0"
